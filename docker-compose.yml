services:
  postgres:
    # ParadeDB bundles pgvector + pg_search (BM25) on PostgreSQL 16.
    # Pin a -pg16 tag explicitly: floating `latest` ships PG18, which cannot
    # open this project's PG16 data volume.
    image: paradedb/paradedb:0.25.3-pg16
    # pg_search must be preloaded; the flag keeps this independent of whatever
    # postgresql.conf lives inside a volume initialized by an older image.
    command: ["postgres", "-c", "shared_preload_libraries=pg_search"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-research}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-research}
      POSTGRES_DB: ${POSTGRES_DB:-research_radar}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-research} -d ${POSTGRES_DB:-research_radar}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-research}:${POSTGRES_PASSWORD:-research}@postgres:5432/${POSTGRES_DB:-research_radar}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      INGEST_ON_BOOT: ${INGEST_ON_BOOT:-true}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/alembic/versions:/app/alembic/versions
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  scheduler:
    build: ./backend
    command: ["python", "-m", "scripts.scheduler"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-research}:${POSTGRES_PASSWORD:-research}@postgres:5432/${POSTGRES_DB:-research_radar}
      INGEST_INTERVAL_HOURS: ${INGEST_INTERVAL_HOURS:-24}
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    environment:
      API_BASE_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  pgdata:
