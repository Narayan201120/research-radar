<svg xmlns="http://www.w3.org/2000/svg" width="130" height="130" viewBox="0 0 500 500" fill="none">
  <title>Research Radar mark</title>
  <desc>The engraved seal mark from the Research Radar logo.</desc>

  <defs>
    <filter id="seal-lift" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1B2431" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="emboss" x1="70" y1="60" x2="330" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7F6F1" stop-opacity="0.9"/>
      <stop offset="0.42" stop-color="#F7F6F1" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#1B2431" stop-opacity="0"/>
      <stop offset="1" stop-color="#1B2431" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <g transform="translate(50 50)">
    <g filter="url(#seal-lift)">
      <circle cx="200" cy="200" r="152" fill="#F7F6F1" stroke="#1B2431" stroke-width="15"/>

      <path d="M132 155H268" stroke="#1B2431" stroke-width="13" stroke-linecap="round"/>
      <path d="M132 190H247" stroke="#1B2431" stroke-width="13" stroke-linecap="round" opacity="0.8"/>
      <path d="M132 225H258" stroke="#1B2431" stroke-width="13" stroke-linecap="round" opacity="0.62"/>
      <path d="M132 258H222" stroke="#1B2431" stroke-width="13" stroke-linecap="round" opacity="0.45"/>
      <path d="M148 272L272 118" stroke="#8C2B2B" stroke-width="12" stroke-linecap="round"/>
      <circle cx="244" cy="157" r="14" fill="#8C2B2B" stroke="#F7F6F1" stroke-width="4"/>

      <circle cx="200" cy="200" r="152" fill="none" stroke="url(#emboss)" stroke-width="15"/>
    </g>
  </g>
</svg>
