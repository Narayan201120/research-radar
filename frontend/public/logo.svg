<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" fill="none">
  <title>Research Radar</title>
  <desc>Engraved seal medallion framing the ledger and single-scan mark, with a serif wordmark, for Research Radar, a citation index and paper discovery tool.</desc>

  <defs>
    <filter id="seal-lift" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1B2431" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="emboss" x1="70" y1="60" x2="330" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7F6F1" stop-opacity="0.9"/>
      <stop offset="0.42" stop-color="#F7F6F1" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#1B2431" stop-opacity="0"/>
      <stop offset="1" stop-color="#1B2431" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <!-- Mark -->
  <g transform="translate(30 30)">
    <g filter="url(#seal-lift)">
      <circle cx="200" cy="200" r="152" fill="#F7F6F1" stroke="#1B2431" stroke-width="15"/>
      <circle cx="200" cy="200" r="128" stroke="#1B2431" stroke-width="4" opacity="0.5"/>

      <line x1="318.0" y1="200.0" x2="300.0" y2="200.0" stroke="#1B2431" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
      <line x1="314.0" y1="230.5" x2="296.6" y2="225.9" stroke="#1B2431" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
      <line x1="302.2" y1="259.0" x2="286.6" y2="250.0" stroke="#1B2431" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
      <line x1="283.4" y1="283.4" x2="270.7" y2="270.7" stroke="#1B2431" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
      <line x1="259.0" y1="302.2" x2="250.0" y2="286.6" stroke="#1B2431" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
      <line x1="230.5" y1="314.0" x2="225.9" y2="296.6" stroke="#1B2431" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
      <line x1="200.0" y1="318.0" x2="200.0" y2="300.0" stroke="#1B2431" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
      <line x1="169.5" y1="314.0" x2="174.1" y2="296.6" stroke="#1B2431" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
      <line x1="141.0" y1="302.2" x2="150.0" y2="286.6" stroke="#1B2431" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
      <line x1="116.6" y1="283.4" x2="129.3" y2="270.7" stroke="#1B2431" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
      <line x1="97.8" y1="259.0" x2="113.4" y2="250.0" stroke="#1B2431" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
      <line x1="86.0" y1="230.5" x2="103.4" y2="225.9" stroke="#1B2431" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
      <line x1="82.0" y1="200.0" x2="100.0" y2="200.0" stroke="#1B2431" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
      <line x1="86.0" y1="169.5" x2="103.4" y2="174.1" stroke="#1B2431" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
      <line x1="97.8" y1="141.0" x2="113.4" y2="150.0" stroke="#1B2431" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
      <line x1="116.6" y1="116.6" x2="129.3" y2="129.3" stroke="#1B2431" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
      <line x1="141.0" y1="97.8" x2="150.0" y2="113.4" stroke="#1B2431" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
      <line x1="169.5" y1="86.0" x2="174.1" y2="103.4" stroke="#1B2431" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
      <line x1="200.0" y1="82.0" x2="200.0" y2="100.0" stroke="#1B2431" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
      <line x1="230.5" y1="86.0" x2="225.9" y2="103.4" stroke="#1B2431" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
      <line x1="259.0" y1="97.8" x2="250.0" y2="113.4" stroke="#1B2431" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
      <line x1="283.4" y1="116.6" x2="270.7" y2="129.3" stroke="#1B2431" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
      <line x1="302.2" y1="141.0" x2="286.6" y2="150.0" stroke="#1B2431" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
      <line x1="314.0" y1="169.5" x2="296.6" y2="174.1" stroke="#1B2431" stroke-width="5" stroke-linecap="round" opacity="0.45"/>

      <path d="M132 155H268" stroke="#1B2431" stroke-width="13" stroke-linecap="round"/>
      <path d="M132 190H247" stroke="#1B2431" stroke-width="13" stroke-linecap="round" opacity="0.8"/>
      <path d="M132 225H258" stroke="#1B2431" stroke-width="13" stroke-linecap="round" opacity="0.62"/>
      <path d="M132 258H222" stroke="#1B2431" stroke-width="13" stroke-linecap="round" opacity="0.45"/>
      <path d="M148 272L272 118" stroke="#8C2B2B" stroke-width="12" stroke-linecap="round"/>
      <circle cx="244" cy="157" r="14" fill="#8C2B2B" stroke="#F7F6F1" stroke-width="4"/>

      <circle cx="200" cy="200" r="152" fill="none" stroke="url(#emboss)" stroke-width="15"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="475" y="245" font-family="Newsreader, Georgia, 'Times New Roman', serif"
        font-size="104" font-weight="700" letter-spacing="-1" fill="#1B2431">
    Research
  </text>
  <text x="475" y="350" font-family="Newsreader, Georgia, 'Times New Roman', serif"
        font-size="104" font-weight="700" letter-spacing="-1" fill="#1B2431">
    Radar
  </text>

  <!-- Small descriptor -->
  <text x="478" y="410" font-family="Inter, Arial, Helvetica, sans-serif"
        font-size="26" font-weight="600" letter-spacing="2" fill="#5F6E64">
    Every paper, on the record.
  </text>
</svg>
