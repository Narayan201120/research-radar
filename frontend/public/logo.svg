<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" fill="none">
  <title>Research Radar logo</title>
  <desc>A modern research discovery logo combining a radar signal with a research paper.</desc>

  <!-- Mark -->
  <g transform="translate(55 55)">
    <!-- Paper -->
    <path d="M145 55H315L385 125V355H145C128.431 355 115 341.569 115 325V85C115 68.431 128.431 55 145 55Z"
          stroke="#172033" stroke-width="24" stroke-linejoin="round"/>
    <path d="M315 55V125H385" stroke="#172033" stroke-width="24" stroke-linejoin="round"/>
    <path d="M165 185H330M165 235H330M165 285H285"
          stroke="#172033" stroke-width="18" stroke-linecap="round"/>

    <!-- Radar -->
    <circle cx="250" cy="250" r="155" stroke="#2563EB" stroke-width="20" opacity="0.18"/>
    <path d="M250 250L362 138" stroke="#2563EB" stroke-width="22" stroke-linecap="round"/>
    <path d="M250 250L250 102M250 250L398 250"
          stroke="#2563EB" stroke-width="13" stroke-linecap="round" opacity="0.55"/>
    <path d="M250 250A148 148 0 0 1 355 355"
          stroke="#2563EB" stroke-width="20" stroke-linecap="round"/>
    <path d="M250 250A105 105 0 0 1 324 324"
          stroke="#2563EB" stroke-width="18" stroke-linecap="round"/>
    <circle cx="250" cy="250" r="25" fill="#2563EB"/>
    <circle cx="362" cy="138" r="18" fill="#2563EB"/>
  </g>

  <!-- Wordmark -->
  <text x="505" y="245" font-family="Inter, Arial, Helvetica, sans-serif"
        font-size="104" font-weight="700" letter-spacing="-3" fill="#172033">
    Research
  </text>
  <text x="505" y="350" font-family="Inter, Arial, Helvetica, sans-serif"
        font-size="104" font-weight="700" letter-spacing="-3" fill="#2563EB">
    Radar
  </text>

  <!-- Small descriptor -->
  <text x="510" y="410" font-family="Inter, Arial, Helvetica, sans-serif"
        font-size="28" font-weight="500" letter-spacing="3" fill="#64748B">
    RESEARCH DISCOVERY
  </text>
</svg>
